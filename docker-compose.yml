services:
  backend:
    build: ./backend
    container_name: smart-chat-backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smart-chat-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
